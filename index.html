<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貸後管理工作台（示範版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6678; --line:#DCE2EA;
  --accent:#1F5F7A; --accent-soft:#E3EEF3;
  --red:#C2362F; --red-soft:#FBE9E7; --amber:#B97E08; --amber-soft:#FCF3DE; --green:#2F7D55; --green-soft:#E4F2EA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#171E28; --ink:#E6EBF2; --muted:#97A3B5; --line:#2A3443;
    --accent:#6DB3D1; --accent-soft:#1B2E3A;
    --red:#EC6A60; --red-soft:#3A1F1E; --amber:#E3B04A; --amber-soft:#3A3020; --green:#5BBE8A; --green-soft:#1C3328;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E28; --ink:#E6EBF2; --muted:#97A3B5; --line:#2A3443;
  --accent:#6DB3D1; --accent-soft:#1B2E3A;
  --red:#EC6A60; --red-soft:#3A1F1E; --amber:#E3B04A; --amber-soft:#3A3020; --green:#5BBE8A; --green-soft:#1C3328;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.demo{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:4px;padding:0 6px;font-size:12px;margin-left:6px;vertical-align:middle}

/* portfolio strip */
.portfolio{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.portfolio h2{font-size:15px;margin:0 0 10px;font-weight:500;color:var(--muted)}
.strip{display:flex;gap:2px;height:64px;border-radius:6px;overflow:hidden}
.seg{border:0;padding:0;cursor:pointer;min-width:4px;position:relative}
.seg.red{background:var(--red)} .seg.yellow{background:var(--amber)} .seg.green{background:var(--green)}
.seg:hover,.seg:focus-visible{filter:brightness(1.15);outline:2px solid var(--ink);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.red{background:var(--red)} .dot.yellow{background:var(--amber)} .dot.green{background:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.stats div{font-size:12px;color:var(--muted)}
.stats strong{display:block;font-size:19px;color:var(--ink);font-weight:500}

/* tabs */
.tabs{display:flex;gap:4px;margin:22px 0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:0 6px;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* case list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:14px 1fr auto;gap:4px 10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row .dot{margin-top:7px}
.row .name{font-weight:500}
.row .meta{font-size:12px;color:var(--muted)}
.row .amt{text-align:right;font-weight:500}
.row .reason{grid-column:2/4;font-size:13px;color:var(--muted)}
.row .reason.red{color:var(--red)} .row .reason.yellow{color:var(--amber)}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin-left:6px;font-weight:500;vertical-align:1px}
.badge.red{background:var(--red-soft);color:var(--red)} .badge.yellow{background:var(--amber-soft);color:var(--amber)} .badge.green{background:var(--green-soft);color:var(--green)}

/* todos */
.todo{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.todo:last-child{border-bottom:0}
.todo:hover{background:var(--bg)}
.todo .type{font-size:12px;font-weight:500;border-radius:4px;padding:1px 8px;align-self:start;margin-top:2px;white-space:nowrap}
.type.t0{background:var(--red-soft);color:var(--red)} .type.t1{background:var(--amber-soft);color:var(--amber)} .type.t2{background:var(--accent-soft);color:var(--accent)}
.todo .who{font-weight:500}
.todo .what{font-size:13px;color:var(--muted)}

/* settings */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.settings label:last-of-type{border-bottom:0}
.settings small{display:block;color:var(--muted);font-size:12px}
input[type=number],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=number]{width:96px;text-align:right}
.btn{font:inherit;font-size:14px;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:none;color:var(--accent)}
.btn.warn{background:none;border-color:var(--red);color:var(--red)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;z-index:10}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:11;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 32px)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dhead h2{margin:0;font-size:20px}
.close{background:none;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);padding:2px 10px;cursor:pointer}
.light{display:flex;align-items:center;gap:10px;margin:14px 0;padding:10px 12px;border-radius:8px}
.light.red{background:var(--red-soft);color:var(--red)} .light.yellow{background:var(--amber-soft);color:var(--amber)} .light.green{background:var(--green-soft);color:var(--green)}
.light strong{font-size:16px}
.light ul{margin:0;padding-left:18px;font-size:13px}
.section{margin-top:18px}
.section h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:500}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;text-align:right}
.ratios{width:100%;border-collapse:collapse;font-size:14px}
.ratios th,.ratios td{padding:5px 0;border-bottom:1px solid var(--line);text-align:right}
.ratios th:first-child,.ratios td:first-child{text-align:left}
.ratios th{font-weight:500;color:var(--muted);font-size:12px}
.bad{color:var(--red);font-weight:500}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.edit input{width:100%;text-align:left}
.summary{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;white-space:pre-wrap;user-select:text}
.notes{list-style:none;margin:0;padding:0;font-size:14px}
.notes li{padding:6px 0;border-bottom:1px solid var(--line)}
.notes time{color:var(--muted);font-size:12px;margin-right:8px}
textarea{width:100%;min-height:64px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:6px;font-size:14px;z-index:20;display:none}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
@media (max-width:520px){
  .stats strong{font-size:17px}
  .edit{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>貸後管理工作台<span class="demo">示範資料</span></h1>
    <p id="asof"></p>
  </header>

  <section class="portfolio" aria-labelledby="ph">
    <h2 id="ph">放款組合一覽（色塊寬度＝放款餘額，點擊看個案）</h2>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"></div>
    <div class="stats" id="stats"></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="cases" aria-selected="true">案件</button>
    <button class="tab" role="tab" data-tab="todos" aria-selected="false">待辦<span class="n" id="todoN"></span></button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">預警門檻</button>
  </div>

  <div id="panel-cases">
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </div>
  <div id="panel-todos" hidden><div class="list" id="todos"></div></div>
  <div id="panel-settings" hidden>
    <div class="settings" id="settings"></div>
    <div class="actions">
      <button class="btn warn" id="reset">清除我的修改，回到原始示範資料</button>
    </div>
  </div>

  <footer>所有公司與數字皆為虛構示範資料。修改內容只存在這台裝置的瀏覽器中。</footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
const TODAY = new Date('2026-10-05T00:00:00');
const KEY = 'post-loan-demo-v1';
const DEFAULT_SETTINGS = {ltvRed:85, ltvYellow:70, revDrop:-20, yellowToRed:3};

const SEED = [

  col:{type:'廠房',value:7000,date:'2024-08-15'},fin:{period:'2026 上半年',debt:74,cr:0.92,icr:1.3,rev:-22},cov:{debtMax:70,crMin:1.0,icrMin:2.0},notes:[{d:'2026-09-22',t:'電話聯繫財務長，表示主要客戶延遲付款，預計十月底前補繳兩期。'}]},
 {id:'A003',name:'昌隆物流',ind:'運輸倉儲',officer:'林怡君',principal:13000,balance:12000,rate:2.20,maturity:'2029-12-31',nextReview:'2026-12-01',overdueDays:0,
  col:{type:'倉庫及土地',value:13500,date:'2026-02-20'},fin:{period:'2026 上半年',debt:62,cr:1.10,icr:2.1,rev:-3},cov:{debtMax:70,crMin:1.0,icrMin:1.8},notes:[]},
 {id:'A004',name:'綠田農產',ind:'農產批發',officer:'王思涵',principal:2000,balance:1800,rate:3.10,maturity:'2027-08-31',nextReview:'2027-01-10',overdueDays:12,
  col:null,fin:{period:'2026 上半年',debt:55,cr:1.30,icr:3.0,rev:4},cov:{debtMax:65,crMin:1.1,icrMin:2.0},notes:[]},
 {id:'A005',name:'瑞豐電子',ind:'電子零組件',officer:'陳柏宇',principal:12000,balance:9500,rate:2.15,maturity:'2030-03-31',nextReview:'2027-02-15',overdueDays:0,
  col:{type:'廠房及土地',value:16000,date:'2026-05-08'},fin:{period:'2026 上半年',debt:48,cr:1.80,icr:7.2,rev:12},cov:{debtMax:60,crMin:1.2,icrMin:3.0},notes:[]},
 {id:'A006',name:'金城建設',ind:'營建',officer:'王思涵',principal:28000,balance:25000,rate:2.80,maturity:'2026-12-15',nextReview:'2026-10-30',overdueDays:0,
  col:{type:'建案土地',value:30000,date:'2025-12-01'},fin:{period:'2026 上半年',debt:78,cr:1.15,icr:1.4,rev:-12},cov:{debtMax:75,crMin:1.0,icrMin:1.5},notes:[]},
 {id:'A007',name:'大洋水產',ind:'漁業',officer:'林怡君',principal:4000,balance:3200,rate:2.90,maturity:'2027-06-30',nextReview:'2026-09-15',overdueDays:95,
  col:{type:'冷凍廠房',value:4000,date:'2023-12-05'},fin:{period:'2025 全年',debt:81,cr:0.78,icr:0.6,rev:-31},cov:{debtMax:70,crMin:1.0,icrMin:1.5},notes:[{d:'2026-09-30',t:'寄發催告函；負責人未接電話。'}]},

  col:null,fin:{period:'2026 上半年',debt:44,cr:1.95,icr:6.1,rev:-18},cov:{debtMax:60,crMin:1.2,icrMin:3.0},notes:[]},
 {id:'A009',name:'和興紡織',ind:'紡織',officer:'王思涵',principal:5000,balance:4100,rate:2.45,maturity:'2028-09-30',nextReview:'2026-12-20',overdueDays:0,
  col:{type:'廠房',value:7600,date:'2025-07-18'},fin:{period:'2026 上半年',debt:69,cr:1.05,icr:1.8,rev:-25},cov:{debtMax:70,crMin:1.0,icrMin:1.5},notes:[]},
 {id:'A010',name:'樂饗餐飲',ind:'餐飲',officer:'林怡君',principal:1500,balance:1200,rate:3.30,maturity:'2027-11-30',nextReview:'2026-11-05',overdueDays:28,
  col:null,fin:{period:'2026 上半年',debt:66,cr:0.95,icr:2.2,rev:-8},cov:{debtMax:70,crMin:1.0,icrMin:1.5},notes:[]},
 {id:'A011',name:'立達化工',ind:'化工',officer:'陳柏宇',principal:9000,balance:7800,rate:2.30,maturity:'2029-05-31',nextReview:'2027-01-20',overdueDays:0,
  col:{type:'廠房及土地',value:10800,date:'2026-03-12'},fin:{period:'2026 上半年',debt:52,cr:1.55,icr:5.0,rev:3},cov:{debtMax:65,crMin:1.2,icrMin:2.5},notes:[]},
 {id:'A012',name:'佳鴻汽車零件',ind:'汽車零件',officer:'王思涵',principal:7500,balance:6300,rate:2.55,maturity:'2028-04-30',nextReview:'2026-10-12',overdueDays:63,
  col:{type:'廠房',value:8000,date:'2025-04-22'},fin:{period:'2026 上半年',debt:72,cr:0.98,icr:1.2,rev:-19},cov:{debtMax:70,crMin:1.0,icrMin:1.5},notes:[]},
 {id:'A013',name:'遠揚貿易',ind:'進出口貿易',officer:'林怡君',principal:3500,balance:3000,rate:2.70,maturity:'2026-11-30',nextReview:'2026-11-10',overdueDays:0,
  col:null,fin:{period:'2026 上半年',debt:50,cr:1.40,icr:4.2,rev:5},cov:{debtMax:65,crMin:1.2,icrMin:2.5},notes:[]},
 {id:'A014',name:'恆毅醫材',ind:'醫療器材',officer:'陳柏宇',principal:6000,balance:5000,rate:2.25,maturity:'2030-08-31',nextReview:'2027-03-01',overdueDays:0,
  col:{type:'廠房及土地',value:9000,date:'2026-06-30'},fin:{period:'2026 上半年',debt:45,cr:1.70,icr:6.5,rev:9},cov:{debtMax:60,crMin:1.2,icrMin:3.0},notes:[]}
];

const clone = o => JSON.parse(JSON.stringify(o));
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let state = load() || {loans:clone(SEED), settings:{...DEFAULT_SETTINGS}};
let filter = 'all';

const fmt = n => Math.round(n).toLocaleString('zh-TW');
const pct = n => (Math.round(n*10)/10).toFixed(1);
const d = s => new Date(s+'T00:00:00');
const daysFrom = s => Math.round((d(s) - TODAY)/86400000);
function bucket(od){ if(od<=0) return '正常'; if(od<=30) return 'M1'; if(od<=60) return 'M2'; if(od<=90) return 'M3'; return 'M3 以上'; }
const LIGHT_TEXT = {red:'紅燈',yellow:'黃燈',green:'綠燈'};
const RANK = {red:0,yellow:1,green:2};

function evaluate(l){
  const s = state.settings, f = l.fin, c = l.cov, flags = [];
  if(l.overdueDays > 60) flags.push({lv:'red',k:'od',t:`逾期 ${l.overdueDays} 天（${bucket(l.overdueDays)}）`});
  else if(l.overdueDays > 0) flags.push({lv:'yellow',k:'od',t:`逾期 ${l.overdueDays} 天（${bucket(l.overdueDays)}）`});
  const ltv = l.col ? l.balance / l.col.value * 100 : null;
  if(ltv !== null){
    if(ltv > s.ltvRed) flags.push({lv:'red',k:'ltv',t:`貸放成數 ${pct(ltv)}%，超過 ${s.ltvRed}%`});
    else if(ltv > s.ltvYellow) flags.push({lv:'yellow',k:'ltv',t:`貸放成數 ${pct(ltv)}%，超過 ${s.ltvYellow}%`});
  }
  if(f.icr < 1) flags.push({lv:'red',k:'icr',t:`利息保障倍數 ${f.icr}，獲利不足支付利息`});
  else if(f.icr < c.icrMin) flags.push({lv:'yellow',k:'cov',t:`利息保障倍數 ${f.icr}，低於約定 ${c.icrMin}`});
  if(f.debt > c.debtMax) flags.push({lv:'yellow',k:'cov',t:`負債比 ${f.debt}%，超過約定上限 ${c.debtMax}%`});
  if(f.cr < c.crMin) flags.push({lv:'yellow',k:'cov',t:`流動比率 ${f.cr}，低於約定 ${c.crMin}`});
  if(f.rev <= s.revDrop) flags.push({lv:'yellow',k:'rev',t:`營收年減 ${Math.abs(f.rev)}%`});
  const reds = flags.filter(x=>x.lv==='red').length, yellows = flags.filter(x=>x.lv==='yellow').length;
  let light = 'green';
  if(reds || yellows >= s.yellowToRed) light = 'red'; else if(yellows) light = 'yellow';
  if(light==='red' && !reds) flags.unshift({lv:'red',k:'many',t:`同時出現 ${yellows} 項黃燈警訊`});
  flags.sort((a,b)=>RANK[a.lv]-RANK[b.lv]);
  return {flags, ltv, light};
}

function todosFor(l){
  const out = [];
  if(l.overdueDays > 0) out.push({p:l.overdueDays>60?0:1, type:'催收', text:`逾期 ${l.overdueDays} 天，聯繫借戶並記錄還款計畫`, sort:-l.overdueDays});
  const r = daysFrom(l.nextReview);
  if(r < 0) out.push({p:0, type:'覆審', text:`覆審已逾期 ${-r} 天（原訂 ${l.nextReview}）`, sort:r});
  else if(r <= 30) out.push({p:1, type:'覆審', text:`覆審將於 ${r} 天後到期（${l.nextReview}）`, sort:r});
  if(l.col){ const age = -daysFrom(l.col.date); if(age > 365) out.push({p:1, type:'鑑價', text:`擔保品鑑價已 ${Math.floor(age/30)} 個月未更新，安排重新鑑價`, sort:50}); }
  const m = daysFrom(l.maturity);
  if(m >= 0 && m <= 90) out.push({p:2, type:'到期', text:`貸款將於 ${m} 天後到期（${l.maturity}），確認續約或還款安排`, sort:m});
  return out.map(t=>({...t, loan:l}));
}
function allTodos(){ return state.loans.flatMap(todosFor).sort((a,b)=>a.p-b.p || a.sort-b.sort); }

function sortedLoans(){
  return state.loans.map(l=>({l, e:evaluate(l)}))
    .sort((a,b)=>RANK[a.e.light]-RANK[b.e.light] || b.l.balance-a.l.balance);
}

function renderTop(){
  document.getElementById('asof').textContent = `資料基準日 2026-10-05　共 ${state.loans.length} 戶`;
  const rows = sortedLoans();
  document.getElementById('strip').innerHTML = rows.map(({l,e}) =>
    `<button class="seg ${e.light}" style="flex-grow:${l.balance}" data-id="${l.id}" aria-label="${l.name}，${LIGHT_TEXT[e.light]}，餘額 ${fmt(l.balance)} 萬元" title="${l.name}　${fmt(l.balance)} 萬"></button>`).join('');
  const total = rows.reduce((s,r)=>s+r.l.balance,0);
  const by = {red:{n:0,a:0},yellow:{n:0,a:0},green:{n:0,a:0}};
  rows.forEach(({l,e})=>{by[e.light].n++; by[e.light].a+=l.balance;});
  document.getElementById('legend').innerHTML = ['red','yellow','green'].map(k =>
    `<span><span class="dot ${k}"></span>${LIGHT_TEXT[k]} <b>${by[k].n} 戶</b>，${fmt(by[k].a)} 萬（${pct(by[k].a/total*100)}%）</span>`).join('');
  const odAmt = state.loans.filter(l=>l.overdueDays>0).reduce((s,l)=>s+l.balance,0);
  const npl = state.loans.filter(l=>l.overdueDays>90).reduce((s,l)=>s+l.balance,0);
  document.getElementById('stats').innerHTML =
    `<div>總放款餘額<strong>${fmt(total)} 萬</strong></div>
     <div>逾期比率<strong>${pct(odAmt/total*100)}%</strong></div>
     <div>逾 90 天比率<strong>${pct(npl/total*100)}%</strong></div>`;
  document.getElementById('todoN').textContent = allTodos().length;
}

function renderChips(){
  const opts = [['all','全部'],['red','紅燈'],['yellow','黃燈'],['od','有逾期'],['col','擔保放款']];
  document.getElementById('chips').innerHTML = opts.map(([k,t]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${t}</button>`).join('');
}

function renderList(){
  let rows = sortedLoans();
  if(filter==='red'||filter==='yellow') rows = rows.filter(r=>r.e.light===filter);
  if(filter==='od') rows = rows.filter(r=>r.l.overdueDays>0);
  if(filter==='col') rows = rows.filter(r=>r.l.col);
  const el = document.getElementById('list');
  if(!rows.length){ el.innerHTML = '<div class="empty">這個篩選條件下沒有案件。</div>'; return; }
  el.innerHTML = rows.map(({l,e}) => {
    const top = e.flags[0];
    const od = l.overdueDays>0 ? `<span class="badge ${l.overdueDays>60?'red':'yellow'}">${bucket(l.overdueDays)}</span>` : '';
    return `<button class="row" data-id="${l.id}">
      <span class="dot ${e.light}" aria-label="${LIGHT_TEXT[e.light]}"></span>
      <span><span class="name">${l.name}</span>${od}<br><span class="meta">${l.id}　${l.ind}　${l.officer}　${l.col?'成數 '+pct(e.ltv)+'%':'無擔保'}</span></span>
      <span class="amt">${fmt(l.balance)} 萬<br><span class="meta">${l.rate.toFixed(2)}%</span></span>
      <span class="reason ${top?top.lv:''}">${top ? top.t + (e.flags.length>1?`，另有 ${e.flags.length-1} 項`:'') : '目前無預警事項'}</span>
    </button>`;
  }).join('');
}

function renderTodos(){
  const t = allTodos(), el = document.getElementById('todos');
  if(!t.length){ el.innerHTML = '<div class="empty">目前沒有待辦事項。</div>'; return; }
  el.innerHTML = t.map(x => `<button class="todo" data-id="${x.loan.id}">
    <span class="type t${x.p}">${x.type}</span>
    <span><span class="who">${x.loan.name}</span><br><span class="what">${x.text}</span></span></button>`).join('');
}

function renderSettings(){
  const s = state.settings;
  document.getElementById('settings').innerHTML = `
    <label><span>貸放成數紅燈門檻（%）<small>放款餘額 ÷ 擔保品鑑價超過此值即紅燈</small></span><input type="number" data-s="ltvRed" value="${s.ltvRed}" min="0" max="200"></label>
    <label><span>貸放成數黃燈門檻（%）</span><input type="number" data-s="ltvYellow" value="${s.ltvYellow}" min="0" max="200"></label>
    <label><span>營收年減警示（%）<small>例如 -20 代表營收年減 20% 以上亮黃燈</small></span><input type="number" data-s="revDrop" value="${s.revDrop}" max="0" min="-100"></label>
    <label><span>幾項黃燈升為紅燈<small>同一戶黃燈警訊達此數量，整戶判為紅燈</small></span><input type="number" data-s="yellowToRed" value="${s.yellowToRed}" min="1" max="9"></label>
    <p style="font-size:12px;color:var(--muted);margin:10px 0 0">逾期超過 60 天、利息保障倍數低於 1 一律判為紅燈。財務比率的約定值依各戶合約設定，在個案頁可看到。</p>`;
}

function suggestion(l,e){
  const k = new Set(e.flags.map(f=>f.k)), s = [];
  if(k.has('od')) s.push(l.overdueDays>90 ? '已逾 90 天，評估轉列逾期放款並啟動法律催收程序' : '持續催收，取得借戶書面還款計畫');
  if(k.has('ltv')) s.push('評估要求增提擔保品或部分還款以降低成數');
  if(k.has('cov')||k.has('icr')) s.push('依合約財務承諾條款，要求借戶提出改善計畫');
  if(k.has('rev')) s.push('了解營收下滑原因，提高覆審頻率');
  if(l.col && -daysFrom(l.col.date) > 365) s.push('安排擔保品重新鑑價');
  return s.length ? s : ['維持正常追蹤，依排程辦理覆審'];
}

function summaryText(l,e){
  const f = l.fin;
  const colLine = l.col ? `擔保品為${l.col.type}，最新鑑價 ${fmt(l.col.value)} 萬元（${l.col.date}），貸放成數 ${pct(e.ltv)}%。` : '本筆為無擔保放款。';
  const reasons = e.flags.length ? `主要原因：${e.flags.map(x=>x.t).join('；')}。` : '目前無預警事項。';
  return `${l.name}（${l.id}，${l.ind}）
核貸額度 ${fmt(l.principal)} 萬元，目前放款餘額 ${fmt(l.balance)} 萬元，利率 ${l.rate.toFixed(2)}%，到期日 ${l.maturity}。
還款狀況：${l.overdueDays>0 ? `逾期 ${l.overdueDays} 天（${bucket(l.overdueDays)}）` : '正常繳息'}。
${colLine}
${f.period}財務：負債比 ${f.debt}%、流動比率 ${f.cr}、利息保障倍數 ${f.icr}、營收年增率 ${f.rev>0?'+':''}${f.rev}%。
預警判定：${LIGHT_TEXT[e.light]}。${reasons}
建議措施：${suggestion(l,e).join('；')}。`;
}

let openId = null, lastFocus = null;
function openDrawer(id){
  const l = state.loans.find(x=>x.id===id); if(!l) return;
  openId = id; lastFocus = document.activeElement;
  const e = evaluate(l), f = l.fin, c = l.cov;
  const dr = document.getElementById('drawer');
  const cell = (v,bad) => `<td class="${bad?'bad':''}">${v}</td>`;
  dr.innerHTML = `
    <div class="dhead"><div><h2>${l.name}</h2><div style="color:var(--muted);font-size:13px">${l.id}　${l.ind}　承辦 ${l.officer}</div></div>
      <button class="close" id="closeD">關閉</button></div>
    <div class="light ${e.light}"><span class="dot ${e.light}" style="width:14px;height:14px"></span>
      <div><strong>${LIGHT_TEXT[e.light]}</strong>${e.flags.length?`<ul>${e.flags.map(x=>`<li>${x.t}</li>`).join('')}</ul>`:'<div style="font-size:13px">目前無預警事項</div>'}</div></div>

    <div class="section"><h3>放款資訊</h3><dl class="kv">
      <dt>核貸額度</dt><dd>${fmt(l.principal)} 萬</dd>
      <dt>放款餘額</dt><dd>${fmt(l.balance)} 萬</dd>
      <dt>利率</dt><dd>${l.rate.toFixed(2)}%</dd>
      <dt>到期日</dt><dd>${l.maturity}</dd>
      <dt>下次覆審</dt><dd>${l.nextReview}</dd>
      <dt>擔保品</dt><dd>${l.col?`${l.col.type}，鑑價 ${fmt(l.col.value)} 萬（${l.col.date}）`:'無擔保'}</dd>
      ${l.col?`<dt>貸放成數</dt><dd class="${e.ltv>state.settings.ltvYellow?'bad':''}">${pct(e.ltv)}%</dd>`:''}
    </dl></div>

    <div class="section"><h3>財務比率（${f.period}）</h3>
      <table class="ratios"><thead><tr><th>項目</th><th>本期</th><th>合約約定</th></tr></thead><tbody>
        <tr><td>負債比</td>${cell(f.debt+'%', f.debt>c.debtMax)}<td>≦ ${c.debtMax}%</td></tr>
        <tr><td>流動比率</td>${cell(f.cr, f.cr<c.crMin)}<td>≧ ${c.crMin}</td></tr>
        <tr><td>利息保障倍數</td>${cell(f.icr, f.icr<c.icrMin)}<td>≧ ${c.icrMin}</td></tr>
        <tr><td>營收年增率</td>${cell((f.rev>0?'+':'')+f.rev+'%', f.rev<=state.settings.revDrop)}<td>—</td></tr>
      </tbody></table></div>

    <div class="section"><h3>更新資料</h3>
      <div class="edit">
        <label>逾期天數<input type="number" id="eOd" value="${l.overdueDays}" min="0"></label>
        <label>放款餘額（萬）<input type="number" id="eBal" value="${l.balance}" min="0"></label>
        ${l.col?`<label>最新鑑價（萬）<input type="number" id="eCol" value="${l.col.value}" min="1"></label>
        <label>鑑價日期<input type="date" id="eColD" value="${l.col.date}"></label>`:''}
        <label>負債比（%）<input type="number" id="eDebt" value="${f.debt}" step="0.1"></label>
        <label>流動比率<input type="number" id="eCr" value="${f.cr}" step="0.01"></label>
        <label>利息保障倍數<input type="number" id="eIcr" value="${f.icr}" step="0.1"></label>
        <label>營收年增率（%）<input type="number" id="eRev" value="${f.rev}" step="0.1"></label>
      </div>
      <div class="actions"><button class="btn" id="saveD">儲存並重新判定</button></div>
    </div>

    <div class="section"><h3>覆審摘要（自動產生，可直接複製）</h3>
      <div class="summary">${summaryText(l,e)}</div></div>

    <div class="section"><h3>追蹤紀錄</h3>
      ${l.notes.length?`<ul class="notes">${l.notes.slice().reverse().map(n=>`<li><time>${n.d}</time>${n.t.replace(/</g,'&lt;')}</li>`).join('')}</ul>`:'<p style="color:var(--muted);font-size:14px;margin:0 0 6px">還沒有紀錄。聯繫借戶後在下面記一筆。</p>'}
      <textarea id="eNote" placeholder="例如：已電話聯繫負責人，承諾月底前繳清"></textarea>
      <div class="actions"><button class="btn ghost" id="addNote">新增紀錄</button></div>
    </div>`;
  dr.classList.add('open'); dr.setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('closeD').focus();
}
function closeDrawer(){
  const dr = document.getElementById('drawer');
  dr.classList.remove('open'); dr.setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('open');
  openId = null; if(lastFocus) lastFocus.focus();
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display='none',1800); }
function renderAll(){ renderTop(); renderChips(); renderList(); renderTodos(); renderSettings(); }

document.addEventListener('click', ev => {
  const t = ev.target;
  const idEl = t.closest('[data-id]');
  if(idEl && !t.closest('#drawer')){ openDrawer(idEl.dataset.id); return; }
  const chip = t.closest('.chip'); if(chip){ filter = chip.dataset.f; renderChips(); renderList(); return; }
  const tab = t.closest('.tab');
  if(tab){ document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b===tab));
    ['cases','todos','settings'].forEach(k=>document.getElementById('panel-'+k).hidden = k!==tab.dataset.tab); return; }
  if(t.id==='scrim' || t.id==='closeD'){ closeDrawer(); return; }
  if(t.id==='saveD'){
    const l = state.loans.find(x=>x.id===openId), num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v)?null:v; };
    const od=num('eOd'), bal=num('eBal'), debt=num('eDebt'), cr=num('eCr'), icr=num('eIcr'), rev=num('eRev');
    if(od!==null) l.overdueDays = Math.max(0, Math.round(od));
    if(bal!==null) l.balance = Math.max(0, bal);
    if(l.col){ const cv=num('eCol'); if(cv) l.col.value = cv; const cd=document.getElementById('eColD').value; if(cd) l.col.date = cd; }
    if(debt!==null) l.fin.debt=debt; if(cr!==null) l.fin.cr=cr; if(icr!==null) l.fin.icr=icr; if(rev!==null) l.fin.rev=rev;
    save(); renderAll(); openDrawer(openId); toast('已儲存，燈號已重新判定'); return;
  }
  if(t.id==='addNote'){
    const v = document.getElementById('eNote').value.trim();
    if(!v){ toast('請先輸入紀錄內容'); return; }
    state.loans.find(x=>x.id===openId).notes.push({d:'2026-10-05', t:v});
    save(); openDrawer(openId); toast('已新增紀錄'); return;
  }
  if(t.id==='reset'){
    if(confirm('確定要清除所有修改，回到原始示範資料？')){
      state = {loans:clone(SEED), settings:{...DEFAULT_SETTINGS}}; save(); renderAll(); toast('已回到原始示範資料');
    }
  }
});
document.addEventListener('change', ev => {
  const k = ev.target.dataset && ev.target.dataset.s;
  if(k){ const v = parseFloat(ev.target.value); if(!isNaN(v)){ state.settings[k]=v; save(); renderTop(); renderList(); toast('門檻已更新'); } }
});
document.addEventListener('keydown', ev => { if(ev.key==='Escape' && openId) closeDrawer(); });

renderAll();
</script>
</body>
</html>
